<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clownmeter</title>
    <style>
      :root { color-scheme: light dark; --fg: #1f2328; --muted: #656d76; --bg: #fff; --line: #d0d7de; --accent: #d92d20; }
      @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #8d96a0; --bg: #16181c; --line: #30363d; } }
      body { margin: 0; width: 260px; padding: 14px 16px; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      label { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; cursor: pointer; }
      label small { display: block; color: var(--muted); font-size: 11px; }
      input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
      .meta { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
      .meta code { color: var(--fg); }
      button { margin-top: 10px; width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
      button:hover { border-color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>🤡 Clownmeter</h1>
    <label>
      <span>Enabled</span>
      <input type="checkbox" id="enabled" />
    </label>
    <label>
      <span>Auto-rate visible posts<small>Off: click a 🤡 badge to rate it</small></span>
      <input type="checkbox" id="autoScan" />
    </label>
    <div class="meta">
      <div>Model: <code id="model">…</code></div>
      <div>Cached ratings: <span id="cached">…</span></div>
      <button id="clear" type="button">Clear cached ratings</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
